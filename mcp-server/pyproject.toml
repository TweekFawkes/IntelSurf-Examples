[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelsurf-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing IntelSurf scan/selector tools."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "IntelSurf" }]
requires-python = ">=3.11"
keywords = ["mcp", "claude", "intelsurf", "osint", "threat-intel"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Pinned within a minor; bump deliberately.
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.scripts]
intelsurf-mcp = "intelsurf_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/intelsurf_mcp"]
